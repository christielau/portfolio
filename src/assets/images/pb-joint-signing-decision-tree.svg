<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Joint Signing: Exceptions Before Build</title>
  <desc id="desc">A portfolio-safe decision tree for joint account document signing, showing authentication failures, retries, and assisted fallback paths.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .title { font: 700 44px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .subtitle { font: 500 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #666666; }
      .box { fill: #ffffff; stroke: #e8e2d6; stroke-width: 2; }
      .diamond { fill: #ffffff; stroke: #ffd84d; stroke-width: 5; }
      .text { font: 650 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .small { font: 600 16px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #666666; }
      .arrow { stroke: #111111; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .dashed { stroke-dasharray: 10 8; opacity: 0.9; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000" rx="28" />

  <text class="title" x="96" y="120">Joint Signing: Exceptions Before Build</text>
  <text class="subtitle" x="96" y="158">Make retries, failures, and assisted fallbacks explicit enough to implement.</text>

  <!-- Start -->
  <g>
    <rect class="box" x="500" y="210" width="600" height="86" rx="18" />
    <text class="text" x="800" y="258" text-anchor="middle">Document requires signatures from both parties</text>
  </g>

  <!-- Decision 1 -->
  <g>
    <polygon class="diamond" points="800,310 980,390 800,470 620,390" />
    <text class="text" x="800" y="387" text-anchor="middle">Both authenticated?</text>
  </g>

  <!-- Left recovery path -->
  <g>
    <rect class="box" x="90" y="450" width="540" height="120" rx="18" />
    <text class="text" x="360" y="496" text-anchor="middle">Recovery path</text>
    <text class="small" x="360" y="524" text-anchor="middle">Update contact details / RM-assisted verification</text>

    <rect class="box" x="90" y="590" width="540" height="86" rx="18" />
    <text class="text" x="360" y="640" text-anchor="middle">Retry authentication</text>
  </g>

  <!-- Decision 2 -->
  <g>
    <polygon class="diamond" points="800,510 980,590 800,670 620,590" />
    <text class="text" x="800" y="587" text-anchor="middle">Both signatures complete?</text>
  </g>

  <!-- Retry + fallback -->
  <g>
    <rect class="box" x="1010" y="680" width="520" height="110" rx="18" />
    <text class="text" x="1270" y="724" text-anchor="middle">Retry + reminders</text>
    <text class="small" x="1270" y="752" text-anchor="middle">Time window and attempt limits</text>

    <rect class="box" x="1010" y="810" width="520" height="110" rx="18" />
    <text class="text" x="1270" y="854" text-anchor="middle">Fallback to assisted signing</text>
    <text class="small" x="1270" y="882" text-anchor="middle">RM-assisted / ops-led path</text>
  </g>

  <!-- End -->
  <g>
    <rect class="box" x="500" y="760" width="600" height="86" rx="18" />
    <text class="text" x="800" y="810" text-anchor="middle">Signing complete (audit trail updated)</text>
  </g>

  <!-- Arrows -->
  <g>
    <line class="arrow" x1="800" y1="296" x2="800" y2="310" />

    <path class="arrow" d="M 650 420 C 520 450 520 450 630 510" />
    <text class="small" x="560" y="456">NO</text>

    <line class="arrow" x1="800" y1="470" x2="800" y2="510" />
    <text class="small" x="818" y="502">YES</text>

    <line class="arrow" x1="360" y1="570" x2="360" y2="590" />
    <path class="arrow dashed" d="M 360 590 C 360 470 520 470 620 390" />

    <line class="arrow" x1="800" y1="670" x2="800" y2="760" />
    <text class="small" x="818" y="720">YES</text>

    <path class="arrow" d="M 980 590 C 1120 590 1140 650 1140 680" />
    <text class="small" x="1020" y="574">NO</text>

    <line class="arrow" x1="1270" y1="790" x2="1270" y2="810" />

    <line class="arrow" x1="1010" y1="865" x2="1100" y2="803" />
  </g>
</svg>
