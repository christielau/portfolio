<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Discovery Model Shift: Search-first vs Browse-first</title>
  <desc id="desc">Comparison diagram showing the shift from search-first discovery assumptions to browse-first decision support based on observed seller behaviour.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .title { font: 700 44px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .subtitle { font: 500 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #666666; }
      .panel { fill: #ffffff; stroke: #e8e2d6; stroke-width: 2; }
      .chosen { stroke: #ffd84d; stroke-width: 5; }
      .header { fill: #111111; }
      .headerText { font: 800 20px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #ffffff; letter-spacing: 0.02em; }
      .bullet { fill: #111111; }
      .text { font: 600 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .note { font: 650 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .muted { font: 500 16px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #666666; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000" rx="28" />

  <text class="title" x="96" y="120">Discovery Model Shift</text>
  <text class="subtitle" x="96" y="158">From search-first assumptions to browse-first decision support.</text>

  <!-- Panels -->
  <g>
    <rect class="panel" x="110" y="250" width="650" height="600" rx="18" />
    <rect class="header" x="110" y="250" width="650" height="86" rx="18" />
    <text class="headerText" x="435" y="304" text-anchor="middle">SEARCH-FIRST (ASSUMED)</text>

    <rect class="panel chosen" x="840" y="250" width="650" height="600" rx="18" />
    <rect class="header" x="840" y="250" width="650" height="86" rx="18" />
    <text class="headerText" x="1165" y="304" text-anchor="middle">BROWSE-FIRST (OBSERVED)</text>
  </g>

  <!-- Left bullets -->
  <g>
    <circle class="bullet" cx="160" cy="410" r="6" />
    <text class="text" x="180" y="416">Users know what to search for</text>

    <circle class="bullet" cx="160" cy="470" r="6" />
    <text class="text" x="180" y="476">Decision starts from product name</text>

    <circle class="bullet" cx="160" cy="530" r="6" />
    <text class="text" x="180" y="536">Rationale is implicit or hidden</text>

    <circle class="bullet" cx="160" cy="590" r="6" />
    <text class="text" x="180" y="596">Hard to compare alternatives</text>

    <circle class="bullet" cx="160" cy="650" r="6" />
    <text class="text" x="180" y="656">Confidence depends on prior knowledge</text>
  </g>

  <!-- Right bullets -->
  <g>
    <circle class="bullet" cx="890" cy="410" r="6" />
    <text class="text" x="910" y="416">Users explore possibilities</text>

    <circle class="bullet" cx="890" cy="470" r="6" />
    <text class="text" x="910" y="476">Compare options before committing</text>

    <circle class="bullet" cx="890" cy="530" r="6" />
    <text class="text" x="910" y="536">Needs explainable “why this”</text>

    <circle class="bullet" cx="890" cy="590" r="6" />
    <text class="text" x="910" y="596">Signals shown with progressive disclosure</text>

    <circle class="bullet" cx="890" cy="650" r="6" />
    <text class="text" x="910" y="656">Supports a recommendation story</text>
  </g>

  <text class="note" x="96" y="910">Design principle: decision confidence comes from rationale, not from showing more data.</text>
  <text class="muted" x="96" y="942">Portfolio-safe: no client names, internal system names, or proprietary fields.</text>
</svg>

