<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Decision Chain (Stress Testing / Balance Sheet)</title>
  <desc id="desc">A linear decision chain from scenario to decision via assumptions, signals, options, and trade-offs.</desc>
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .title { font: 700 44px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .subtitle { font: 500 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #666666; }
      .note { font: 500 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .box { fill: #ffffff; stroke: #e8e2d6; stroke-width: 2; }
      .accent { stroke: #ffd84d; stroke-width: 5; }
      .label { font: 700 22px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111111; }
      .arrow { stroke: #111111; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000" rx="28" />

  <text class="title" x="96" y="120">Decision Chain</text>
  <text class="subtitle" x="96" y="158">Used to make stress-testing and reporting logic inspectable before build (pre-mobilisation).</text>

  <!-- Boxes -->
  <g>
    <rect class="box" x="90" y="360" width="220" height="120" rx="18" />
    <text class="label" x="200" y="430" text-anchor="middle">Scenario</text>

    <rect class="box accent" x="330" y="360" width="220" height="120" rx="18" />
    <text class="label" x="440" y="430" text-anchor="middle">Assumptions</text>

    <rect class="box" x="570" y="360" width="220" height="120" rx="18" />
    <text class="label" x="680" y="430" text-anchor="middle">Signals</text>

    <rect class="box" x="810" y="360" width="220" height="120" rx="18" />
    <text class="label" x="920" y="430" text-anchor="middle">Options</text>

    <rect class="box accent" x="1050" y="360" width="220" height="120" rx="18" />
    <text class="label" x="1160" y="430" text-anchor="middle">Trade-offs</text>

    <rect class="box" x="1290" y="360" width="220" height="120" rx="18" />
    <text class="label" x="1400" y="430" text-anchor="middle">Decision</text>
  </g>

  <!-- Arrows -->
  <g>
    <line class="arrow" x1="310" y1="420" x2="330" y2="420" />
    <line class="arrow" x1="550" y1="420" x2="570" y2="420" />
    <line class="arrow" x1="790" y1="420" x2="810" y2="420" />
    <line class="arrow" x1="1030" y1="420" x2="1050" y2="420" />
    <line class="arrow" x1="1270" y1="420" x2="1290" y2="420" />
  </g>

  <text class="note" x="96" y="820">Key move: make assumptions explicit so SMEs can pressure-test decisions, not debate dashboards.</text>
</svg>

